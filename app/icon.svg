<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00f0ff;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#b537f2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff006e;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" fill="#0a0e27" rx="20"/>
  
  <!-- Outer hexagon -->
  <polygon points="50,10 85,30 85,70 50,90 15,70 15,30" 
           fill="none" 
           stroke="url(#grad1)" 
           stroke-width="2"
           filter="url(#glow)"/>
  
  <!-- Inner hexagon -->
  <polygon points="50,25 70,37.5 70,62.5 50,75 30,62.5 30,37.5" 
           fill="none" 
           stroke="#00f0ff" 
           stroke-width="1.5"
           opacity="0.6"/>
  
  <!-- Letter K -->
  <g fill="url(#grad1)" filter="url(#glow)">
    <rect x="42" y="35" width="4" height="30"/>
    <rect x="46" y="48" width="12" height="4" transform="rotate(-45 52 50)"/>
    <rect x="46" y="52" width="12" height="4" transform="rotate(45 52 50)"/>
  </g>
  
  <!-- Corner accents -->
  <circle cx="50" cy="10" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="85" cy="30" r="2" fill="#b537f2" opacity="0.6"/>
  <circle cx="85" cy="70" r="2" fill="#ff006e" opacity="0.6"/>
  <circle cx="50" cy="90" r="3" fill="#00f0ff" opacity="0.8"/>
  <circle cx="15" cy="70" r="2" fill="#b537f2" opacity="0.6"/>
  <circle cx="15" cy="30" r="2" fill="#ff006e" opacity="0.6"/>
</svg>

